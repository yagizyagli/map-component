<section class="demo-card">

<h2>🗺️ Map Component</h2>

<p>
Interactive Leaflet Web Component
</p>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="./index.js"></script>
    
<custom-map
    id="mainMap"
    lat="41.015"
    lng="28.979"
    zoom="13">

    <map-pin
        lat="41.0082"
        lng="28.9784">
        İstanbul
    </map-pin>

    <map-pin
        lat="41.043"
        lng="29.005">
        Beşiktaş
    </map-pin>

    <map-pin
        lat="41.025"
        lng="28.974">
        Taksim
    </map-pin>

</custom-map>


<div class="actions">

<button id="istanbul">
Istanbul
</button>

<button id="fit">
Fit Pins
</button>

</div>

</section>


<script>

const map =
document.querySelector(
    "#mainMap"
);


document.querySelector(
    "#istanbul"
)
.onclick = ()=>{

    map.flyTo(
        41.015,
        28.979,
        13
    );

};


document.querySelector(
    "#fit"
)
.onclick = ()=>{

    map.fitPins();

};


map.addEventListener(
    "ready",
    ()=>{
        console.log(
            "Map ready"
        );
    }
);


map.addEventListener(
    "locationchange",
    e=>{

        console.log(
            e.detail
        );

    }
);


</script>
