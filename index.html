<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Map Component Test</title>


<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>


<style>

body{

    margin:0;

    padding:40px;

    background:#0f172a;

    color:white;

    font-family:
    Arial,
    sans-serif;

}


h1{

    margin-bottom:30px;

}


.card{

    background:#1e293b;

    padding:25px;

    border-radius:20px;

}


custom-map{

    width:100%;

    --map-height:600px;

}


button{

    margin-top:20px;

    padding:12px 20px;

    border:0;

    border-radius:10px;

    cursor:pointer;

    background:#38bdf8;

    color:#082f49;

    font-weight:bold;

}



</style>


</head>


<body>


<h1>
Custom Map Web Component Test
</h1>



<div class="card">


<custom-map
    id="map"
    lat="41.0082"
    lng="28.9784"
    zoom="12">


    <map-pin
        lat="41.015"
        lng="28.979">

        <b>
        İstanbul Nokta 1
        </b>
        <br>
        Fatih

    </map-pin>



    <map-pin
        lat="41.043"
        lng="29.007">

        <b>
        İstanbul Nokta 2
        </b>
        <br>
        Beşiktaş

    </map-pin>



    <map-pin
        lat="40.992"
        lng="29.025">

        <b>
        İstanbul Nokta 3
        </b>
        <br>
        Kadıköy

    </map-pin>



</custom-map>



<button onclick="moveMap()">
Kadıköy'e Git
</button>


<button onclick="showPins()">
Tüm Markerları Göster
</button>



</div>





<script src="./map.js"></script>



<script>


const map =
document.querySelector("#map");



map.addEventListener(
"ready",
()=>{


    console.log(
        "Map ready",
        map.getLocation()
    );


});





map.addEventListener(
"locationchange",
e=>{


    console.log(
        "New Location:",
        e.detail
    );


});





map.addEventListener(
"tileerror",
()=>{


    console.warn(
        "Tile could not be loaded."
    );


});





function moveMap(){


    map.flyTo(
        40.990,
        29.030,
        14
    );


}





function showPins(){


    map.fitPins();


}





</script>



</body>

</html>
